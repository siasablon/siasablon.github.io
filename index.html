<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sia Sablon — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --cream: #F5F0E8; --navy: #1A1F3A; --rose: #C4556A; --warm: #E8A87C; --text: #2D2D2D; --light: #F9F6F0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); overflow-x: hidden; }
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 1.2rem 3rem; display: flex; justify-content: space-between; align-items: center; background: rgba(245,240,232,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(26,31,58,0.08); }
  .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; color: var(--navy); }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a { text-decoration: none; color: var(--navy); font-size: 0.85rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; transition: opacity 0.2s; }
  .nav-links a:hover { opacity: 1; }
  .hero { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; padding-top: 80px; }
  .hero-left { padding: 6rem 4rem 4rem; display: flex; flex-direction: column; justify-content: center; }
  .hero-tag { font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--rose); font-weight: 500; margin-bottom: 1.5rem; }
  .hero-name { font-family: 'Playfair Display', serif; font-size: clamp(3rem, 5vw, 5rem); font-weight: 900; color: var(--navy); line-height: 1.0; margin-bottom: 0.3rem; }
  .hero-name em { font-style: italic; color: var(--rose); }
  .hero-title { font-family: 'Playfair Display', serif; font-size: clamp(1rem, 1.8vw, 1.4rem); font-weight: 400; color: var(--navy); opacity: 0.6; margin-bottom: 2rem; font-style: italic; }
  .hero-desc { font-size: 0.95rem; line-height: 1.8; color: var(--text); opacity: 0.8; max-width: 440px; margin-bottom: 2.5rem; }
  .hero-cta { display: flex; gap: 1rem; flex-wrap: wrap; }
  .btn { padding: 0.8rem 1.8rem; border-radius: 2px; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; transition: all 0.25s; cursor: pointer; border: none; }
  .btn-primary { background: var(--navy); color: var(--cream); }
  .btn-primary:hover { background: var(--rose); transform: translateY(-1px); }
  .btn-outline { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); }
  .btn-outline:hover { background: var(--navy); color: var(--cream); transform: translateY(-1px); }
  .hero-right { background: var(--navy); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .hero-right::before { content: ''; position: absolute; width: 400px; height: 400px; border-radius: 50%; background: var(--rose); opacity: 0.15; top: -100px; right: -100px; }
  .hero-right::after { content: ''; position: absolute; width: 250px; height: 250px; border-radius: 50%; background: var(--warm); opacity: 0.1; bottom: -50px; left: -50px; }
  .hero-monogram { font-family: 'Playfair Display', serif; font-size: 12rem; font-weight: 900; color: rgba(245,240,232,0.06); position: absolute; user-select: none; line-height: 1; }
  .hero-stats { display: flex; flex-direction: column; gap: 2rem; z-index: 1; padding: 3rem; }
  .stat { text-align: center; }
  .stat-num { font-family: 'Playfair Display', serif; font-size: 3rem; font-weight: 700; color: var(--cream); line-height: 1; }
  .stat-label { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(245,240,232,0.5); margin-top: 0.3rem; }
  .stat-divider { width: 1px; height: 40px; background: rgba(245,240,232,0.15); margin: 0 auto; }
  section { padding: 6rem 4rem; }
  .section-label { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--rose); font-weight: 500; margin-bottom: 0.8rem; }
  .section-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 4vw, 3rem); font-weight: 700; color: var(--navy); line-height: 1.15; margin-bottom: 3rem; }
  #projets { background: var(--light); }
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 2rem; }
  .project-card { background: white; border-radius: 4px; overflow: hidden; transition: transform 0.3s, box-shadow 0.3s; box-shadow: 0 2px 12px rgba(26,31,58,0.06); }
  .project-card:hover { transform: translateY(-6px); box-shadow: 0 12px 32px rgba(26,31,58,0.12); }
  .card-top { height: 180px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: var(--navy); }
  .card-top img { width: 100%; height: 100%; object-fit: cover; }
  .card-tag { position: absolute; top: 1rem; right: 1rem; background: rgba(255,255,255,0.2); color: white; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.3rem 0.7rem; border-radius: 2px; backdrop-filter: blur(4px); }
  .card-body { padding: 1.8rem; }
  .card-org { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--rose); font-weight: 500; margin-bottom: 0.5rem; }
  .card-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--navy); margin-bottom: 0.8rem; line-height: 1.3; }
  .card-desc { font-size: 0.88rem; line-height: 1.7; color: var(--text); opacity: 0.75; margin-bottom: 1.2rem; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.2rem; }
  .tag { background: var(--cream); color: var(--navy); font-size: 0.7rem; padding: 0.25rem 0.6rem; border-radius: 2px; font-weight: 500; }
  .card-link { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--rose); font-size: 0.8rem; font-weight: 500; text-decoration: none; transition: gap 0.2s; }
  .card-link:hover { gap: 0.7rem; }
  #visuels { background: var(--navy); }
  #visuels .section-title { color: var(--cream); }
  #visuels .section-label { color: var(--warm); }
  .gallery-intro { font-size: 0.95rem; line-height: 1.8; color: rgba(245,240,232,0.6); max-width: 560px; margin-bottom: 3rem; }
  .gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
  .gallery-item { aspect-ratio: 3/4; border-radius: 4px; overflow: hidden; position: relative; background: rgba(245,240,232,0.05); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(245,240,232,0.1); transition: transform 0.3s; cursor: pointer; }
  .gallery-item:hover { transform: scale(1.02); }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
  .mini-carousel { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .mini-carousel .mini-slides { display: flex; height: 100%; transition: transform 0.4s ease; }
  .mini-carousel .mini-slide { flex: 0 0 100%; height: 100%; }
  .mini-carousel .mini-slide img { width: 100%; height: 100%; object-fit: cover; }

  .mini-carousel .mini-btn.next { right: 6px; }
